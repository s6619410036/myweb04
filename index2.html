<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ใส่ชื่อและรหัส น.ศ. ของคุณที่ Title -->
    <title>Pimpikun SAU - Full Stack Web Developer</title>
    
    <!-- 1. Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Font Awesome (สำหรับ Social Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 3. Devicon CDN (สำหรับ โลโก้ My Tech Stacks ด้านล่าง) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicon/devicon@v2.15.1/devicon.min.css">
    
    <!-- 4. Google Fonts (Playfair Display & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-serif-heading {
            font-family: 'Playfair Display', Georgia, serif;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between px-6 py-8 md:px-16 lg:px-24">

    <!-- Header / Navigation Bar -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between py-4">
        <!-- Logo ด้านซ้าย -->
        <div class="flex items-center gap-1 text-xl md:text-2xl font-bold tracking-tight">
            <span class="text-emerald-400 font-mono font-bold">&gt;_</span>
            <!-- เปลี่ยนเป็นชื่อ น.ศ. ของคุณ -->
            <span class="text-white">Pimpikun SAU</span>
        </div>

        <!-- เมนู Navigation ด้านขวา -->
        <nav class="flex items-center gap-6 md:gap-8">
            <a href="#" class="text-yellow-400 font-semibold text-sm md:text-base transition">Home</a>
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm md:text-base transition">About</a>
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm md:text-base transition">Portfolio</a>
            <a href="#" class="border border-white/80 rounded-full px-5 py-1.5 text-xs md:text-sm font-medium text-white hover:bg-white hover:text-black transition">Let's talk</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <main class="w-full max-w-6xl mx-auto my-auto py-10 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        <!-- ฝั่งซ้าย: ข้อความและโซเชียล -->
        <div class="space-y-6 text-left">
            <h1 class="font-serif-heading text-4xl sm:text-5xl md:text-6xl font-bold leading-tight text-white">
                Full Stack Web<br>Developer !
            </h1>
            <p class="text-gray-300 text-sm md:text-base max-w-md leading-relaxed">
                <!-- เปลี่ยนชื่อ น.ศ. ตรงคำว่า NinniN SAU -->
                Hi, I'm <span class="text-white font-semibold">Pimpikun SAU</span>. A passionate Full Stack Web Developer based in Thailand.
            </p>
            
            <!-- Social Icons (LinkedIn & GitHub) -->
            <div class="flex items-center gap-4 pt-2">
                <a href="#" class="text-white hover:text-gray-300 text-3xl transition" aria-label="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="#" class="text-white hover:text-gray-300 text-3xl transition" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </div>

        <!-- ฝั่งขวา: รูปภาพ Avatar วงกลม -->
        <div class="flex justify-center md:justify-end">
            <div class="w-64 h-64 sm:w-80 sm:h-80 md:w-[380px] md:h-[380px] rounded-full overflow-hidden bg-[#e5a044] flex items-center justify-center shadow-2xl relative border-4 border-black">
                <img src="https://img.freepik.com/premium-photo/3d-avatar-boy-character_113255-92265.jpg" 
                     alt="Profile Avatar" 
                     class="w-full h-full object-cover">
            </div>
        </div>
    </main>

    <!-- Footer: My Tech Stacks Section -->
    <footer class="w-full max-w-6xl mx-auto pt-6 pb-2">
        <h2 class="text-center text-xs md:text-sm font-semibold text-white mb-6 tracking-wide">
            My Tech Stacks
        </h2>
        
        <!-- โลโก้ Tech Stack ทั้ง 9 ตัวตาม Mockup -->
        <div class="flex flex-wrap items-center justify-center gap-6 md:gap-8 text-3xl md:text-4xl">
            <!-- 1. HTML5 -->
            <i class="devicon-html5-plain colored" title="HTML5"></i>
            <!-- 2. CSS3 -->
            <i class="devicon-css3-plain colored" title="CSS3"></i>
            <!-- 3. JavaScript -->
            <i class="devicon-javascript-plain colored rounded" title="JavaScript"></i>
            <!-- 4. Node.js -->
            <i class="devicon-nodejs-plain colored" title="Node.js"></i>
            <!-- 5. React -->
            <i class="devicon-react-original colored" title="React"></i>
            <!-- 6. Spring -->
            <i class="devicon-spring-plain colored" title="Spring Boot"></i>
            <!-- 7. Java -->
            <i class="devicon-java-plain colored" title="Java"></i>
            <!-- 8. Figma -->
            <i class="devicon-figma-plain colored" title="Figma"></i>
            <!-- 9. Firebase -->
            <i class="devicon-firebase-plain colored" title="Firebase"></i>
        </div>
    </footer>

</body>
</html>
