<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch - 6619410036 Pimpikun Butprom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d0e; color: #ffffff; min-height: 100vh; padding: 20px 40px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        nav {
            background-color: #1a1a1c; border-radius: 10px; padding: 16px 30px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 50px; border: 1px solid #28282c;
        }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: #9e9e9e; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        .social-links { display: flex; gap: 18px; align-items: center; }
        .social-links a { color: #9e9e9e; text-decoration: none; font-size: 16px; }

        .contact-box {
            max-width: 600px; background-color: #121214; border: 1px solid #222226;
            border-radius: 12px; padding: 36px; margin: 0 auto;
        }
        .contact-box h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .contact-box p { color: #8f8f93; font-size: 14px; margin-bottom: 24px; font-family: monospace; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #d1d1d6; font-size: 13px; margin-bottom: 8px; font-family: monospace; }
        .form-group input, .form-group textarea {
            width: 100%; background-color: #1a1a1c; border: 1px solid #28282c;
            border-radius: 6px; padding: 12px; color: #ffffff; font-size: 14px; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #39b54a; }

        .btn-submit {
            width: 100%; background-color: #39b54a; color: #ffffff; border: none;
            padding: 12px; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer;
            box-shadow: 0 0 15px rgba(57, 181, 74, 0.4); transition: background-color 0.3s;
        }
        .btn-submit:hover { background-color: #43ca55; }

        @media (max-width: 768px) { nav { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="case-studies.html">Case Studies</a></li>
                <li><a href="#">Testimonials</a></li>
                <li><a href="#">Recent work</a></li>
                <li><a href="get-in-touch.html" class="active">Get In Touch</a></li>
            </ul>
            <div class="social-links">
                <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#"><i class="fa-brands fa-behance"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </nav>

        <div class="contact-box">
            <h1>Get In Touch</h1>
            <p>ส่งข้อความเพื่อติดต่อหรือสอบถามข้อมูลเพิ่มเติมได้เลยค่ะ</p>
            <form action="#">
                <div class="form-group">
                    <label for="name">ชื่อ-นามสกุล / Name</label>
                    <input type="text" id="name" placeholder="ระบุชื่อของคุณ" required>
                </div>
                <div class="form-group">
                    <label for="email">อีเมล / Email</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">ข้อความ / Message</label>
                    <textarea id="message" rows="4" placeholder="พิมพ์ข้อความของคุณที่นี่..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
